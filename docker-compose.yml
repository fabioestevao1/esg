version: "3.9"

name: esg-app-stack

networks:
  app-net: {}

services:
  app:
    image: docker.io/felixian0/esg-app:staging   # altere para :prod quando quiser
    container_name: esg-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      # Oracle FIAP externo
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      # perfil da app
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-staging}
      # (opcional) tunning JVM
      JAVA_OPTS: ${JAVA_OPTS:--Xms256m -Xmx512m}
    networks:
      - app-net
    # Healthcheck opcional — requer 'curl' dentro da imagem (adicione `RUN apk add --no-cache curl` no Dockerfile)
    # healthcheck:
    #   test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
    #   interval: 20s
    #   timeout: 3s
    #   retries: 10
    profiles: ["staging", "production"]
