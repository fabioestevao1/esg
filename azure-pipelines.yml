# =========================
# CI/CD - ESG (Azure DevOps)
# =========================

# Dispara em commits no main e em tags que comecem com v (ex.: v1.0.0)
trigger:
  branches:
    include:
      - main
  tags:
    include:
      - 'v*'

# Pull Requests continuam só para main
pr:
  branches:
    include:
      - main

# Agente self-hosted
pool:
  name: Default

variables:
  dockerHubRepo: 'felixian0/esg-app'
  webAppName: 'esg-app-fiap'
  slotName: 'staging'

  POM_PATH: 'esg/esg/pom.xml'
  DOCKERFILE_PATH: 'esg/esg/Dockerfile'
  DOCKER_BUILD_CONTEXT: 'esg/esg'

  # (ideal: mover para Library > Variable Group como secrets)
  SPRING_DATASOURCE_URL: 'jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL'
  SPRING_DATASOURCE_USERNAME: 'RM557159'
  SPRING_DATASOURCE_PASSWORD: '190803'

stages:

  # ===== Build & Test =====
  - stage: Build_Test
    displayName: "Build & Test (Maven)"
    jobs:
      - job: MavenCI
        displayName: "Maven CI"
        steps:
          - checkout: self
          - powershell: |
              cd "$(System.DefaultWorkingDirectory)"
              if ($env:JAVA_HOME) { & "$env:JAVA_HOME\bin\java.exe" -version }
              & ".\esg\esg\mvnw.cmd" -f ".\esg\esg\pom.xml" -B -e verify
            displayName: "mvnw verify (PowerShell)"

  # ===== Docker Build & Push =====
  - stage: Build_Push_DockerHub
    displayName: "Docker Build & Push (Docker Hub)"
    dependsOn: Build_Test
    condition: succeeded()
    jobs:
      - job: Docker
        displayName: "Build & Push"
        steps:
          - checkout: self

          # Limpa possíveis logins antigos
          - powershell: |
              $ErrorActionPreference = 'SilentlyContinue'
              $registries = @("", "docker.io", "registry-1.docker.io", "https://index.docker.io/v1/")
              foreach ($r in $registries) {
                if ($r) { Write-Host ">> docker logout $r"; docker logout $r | Out-Host }
                else    { Write-Host ">> docker logout (default)"; docker logout | Out-Host }
                if ($LASTEXITCODE -ne 0) { Write-Host "no prior login for '$r'" }
              }
              exit 0
            displayName: "Docker logout (limpar credenciais antigas)"

          # 1) Build sem credencial (puxa base anonimamente)
          - task: Docker@2
            displayName: "Build imagem (sem push)"
            inputs:
              command: build
              repository: '$(dockerHubRepo)'
              Dockerfile: '$(DOCKERFILE_PATH)'
              buildContext: '$(DOCKER_BUILD_CONTEXT)'
              tags: |
                latest
                staging

          # 2) Login no Docker Hub (para o push)
          - task: Docker@2
            displayName: "Login no Docker Hub"
            inputs:
              command: login
              containerRegistry: 'sc-dockerhub'   # Service Connection do Docker Hub

          # 3) Push das tags
          - task: Docker@2
            displayName: "Push :latest e :staging"
            inputs:
              command: push
              containerRegistry: 'sc-dockerhub'
              repository: '$(dockerHubRepo)'
              tags: |
                latest
                staging

          # 4) Cria/pusha :prod quando o build vier de tag v*
          - powershell: |
              if ("$(Build.SourceBranch)".StartsWith("refs/tags/v")) {
                docker pull docker.io/$(dockerHubRepo):latest
                docker tag docker.io/$(dockerHubRepo):latest docker.io/$(dockerHubRepo):prod
                docker push docker.io/$(dockerHubRepo):prod
              }
            displayName: "Gerar/push tag :prod em release"

  # ===== Deploy Staging =====
  - stage: Deploy_Staging
    displayName: "Deploy Staging (slot)"
    dependsOn: Build_Push_DockerHub
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: Deploy
        displayName: "Deploy Staging"
        steps:
          # 1) App Settings separadas (evita erro de parâmetro vazio)
          - task: AzureAppServiceSettings@1
            displayName: "Aplicar App Settings (staging)"
            inputs:
              azureSubscription: 'sc-azure'
              appName: '$(webAppName)'
              slotName: '$(slotName)'
              appSettings: |
                {
                  "WEBSITES_PORT": "8080",
                  "SPRING_DATASOURCE_URL": "$(SPRING_DATASOURCE_URL)",
                  "SPRING_DATASOURCE_USERNAME": "$(SPRING_DATASOURCE_USERNAME)",
                  "SPRING_DATASOURCE_PASSWORD": "$(SPRING_DATASOURCE_PASSWORD)",
                  "SPRING_PROFILES_ACTIVE": "staging"
                }

          # 2) Deploy da imagem do Docker Hub
          - task: AzureWebAppContainer@1
            displayName: "Deploy no slot '$(slotName)' (container)"
            inputs:
              azureSubscription: 'sc-azure'
              appName: '$(webAppName)'
              slotName: '$(slotName)'
              containers: 'docker.io/$(dockerHubRepo):staging'
              # Se o repo no Docker Hub for privado, descomente:
              # containerRegistryType: 'Container Registry'
              # dockerRegistryEndpoint: 'sc-dockerhub'

  # ===== Deploy Produção =====
  - stage: Deploy_Prod
    displayName: "Deploy Produção"
    dependsOn: Build_Push_DockerHub
    condition: and(succeeded(), startsWith(variables['Build.SourceBranch'], 'refs/tags/v'))
    jobs:
      - job: Deploy
        displayName: "Deploy Prod"
        steps:
          - task: AzureAppServiceSettings@1
            displayName: "Aplicar App Settings (prod)"
            inputs:
              azureSubscription: 'sc-azure'
              appName: '$(webAppName)'
              appSettings: |
                {
                  "WEBSITES_PORT": "8080",
                  "SPRING_DATASOURCE_URL": "$(SPRING_DATASOURCE_URL)",
                  "SPRING_DATASOURCE_USERNAME": "$(SPRING_DATASOURCE_USERNAME)",
                  "SPRING_DATASOURCE_PASSWORD": "$(SPRING_DATASOURCE_PASSWORD)",
                  "SPRING_PROFILES_ACTIVE": "prod"
                }

          - task: AzureWebAppContainer@1
            displayName: "Deploy em produção"
            inputs:
              azureSubscription: 'sc-azure'
              appName: '$(webAppName)'
              containers: 'docker.io/$(dockerHubRepo):prod'
              # Se for privado:
              # containerRegistryType: 'Container Registry'
              # dockerRegistryEndpoint: 'sc-dockerhub'
